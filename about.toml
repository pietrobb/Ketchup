# cargo-about: the license texts of the crates compiled into each Kecup
# program, for scripts/third_party_notices.py. The accepted set is the allow
# list of deny.toml, which enforces it; acadrust's MPL-2.0 is its exception.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
]
# The desktop packages: the Windows release, the Linux build and the macOS bundles.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
# The workspace's own crates are Kecup itself (LICENSE), not third parties.
private = { ignore = true }
