[graph]
all-features = true
# Every platform something is built for: the desktop app, CI, the macOS,
# Android and browser Viewers.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "wasm32-unknown-unknown",
]

[advisories]
yanked = "deny"
# Unmaintained, not vulnerable, and with no maintained release of the crate
# that brings them in. A new advisory, or any vulnerability, still fails.
ignore = [
    { id = "RUSTSEC-2024-0388", reason = "derivative: brought in by the vendored starlark 0.13 (third_party/starlark)" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash: brought in by starlark_map 0.13 of the vendored starlark" },
    { id = "RUSTSEC-2024-0436", reason = "paste: brought in by the vendored starlark 0.13 and by metal 0.31 of wgpu" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: the font reader of egui (owned_ttf_parser); ketchup-manufacturing reads the drawing-sheet PDF font with the same version" },
    # Merged into zbus 6. zbus 5 (Linux D-Bus) comes in through accesskit_unix
    # (eframe 0.32 → egui-winit → accesskit_winit, and atspi) and ashpd (rfd 0.15).
    { id = "RUSTSEC-2026-0370", reason = "zvariant: in zbus 5, via accesskit_unix of eframe 0.32 and ashpd of rfd 0.15" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: in zbus 5 and atspi-common, via accesskit_unix of eframe 0.32 and ashpd of rfd 0.15" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: the derive macros of zvariant in zbus 5, via accesskit_unix of eframe 0.32 and ashpd of rfd 0.15" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# acadrust (DWG read/write in ketchup-dwg), used unmodified from crates.io; its
# source link is in THIRD_PARTY_NOTICES.txt. No other crate may bring in MPL-2.0.
[[licenses.exceptions]]
crate = "acadrust"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies (publish = false) carry no version.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
