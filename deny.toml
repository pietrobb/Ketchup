[graph]
all-features = true
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# acadrust (DWG read/write in ketchup-dwg), used unmodified from crates.io; its
# source link is in THIRD_PARTY_NOTICES.txt. No other crate may bring in MPL-2.0.
[[licenses.exceptions]]
crate = "acadrust"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
