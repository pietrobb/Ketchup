[package]
name = "ketchup-manufacturing"
description = "Manufacturing output of a Ketchup model: fabrication, production packages and exporters"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ketchup-model = { path = "../ketchup-model" }
ketchup-geometry = { path = "../ketchup-geometry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
epaint_default_fonts = "0.32.3"
miniz_oxide = "0.8.9"
ttf-parser = "0.25.1"

[dev-dependencies]
ketchup-test-env = { path = "../ketchup-test-env" }
ketchup-model = { path = "../ketchup-model", features = ["testing"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
