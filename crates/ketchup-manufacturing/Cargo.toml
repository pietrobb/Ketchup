[package]
name = "ketchup-manufacturing"
description = "Manufacturing output of a Ketchup model: fabrication, production packages and exporters"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ketchup-dwg = { path = "../ketchup-dwg" }
ketchup-model = { path = "../ketchup-model" }
ketchup-view-format = { path = "../ketchup-view-format" }
ketchup-rejection = { path = "../ketchup-rejection" }
ketchup-geometry = { path = "../ketchup-geometry" }
ab_glyph = "0.2.32"
epaint_default_fonts = "0.32.3"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
ketchup-test-env = { path = "../ketchup-test-env" }
ketchup-model = { path = "../ketchup-model", features = ["testing"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
