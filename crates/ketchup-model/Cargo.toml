[package]
name = "ketchup-model"
description = "The Ketchup document model: canonical document, commands, revisions, evaluator graph and persistence"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Test doubles for exact evaluation results; see `src/testing.rs`.
testing = []
# Every file Save writes also goes to `KETCHUP_SAVED_FILES_DIR`, for each released
# Kečup to open (`scripts/release_reads.py`).
saved-files = []

[dependencies]
ciborium = "0.2"
ed25519-dalek = "2.2.0"
encoding_rs = "0.8.42"
epaint_default_fonts = "0.32.3"
ketchup-geometry = { path = "../ketchup-geometry" }
ketchup-tolerance = { path = "../ketchup-tolerance" }
miniz_oxide = "0.8.9"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.23.0"
ttf-parser = "0.25.1"

[dev-dependencies]
ketchup-test-env = { path = "../ketchup-test-env" }
ketchup-model = { path = ".", features = ["testing"] }
resvg = { version = "0.48.1", default-features = false, features = ["system-fonts", "text"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
