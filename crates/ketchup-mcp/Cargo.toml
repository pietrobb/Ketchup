[package]
name = "ketchup-mcp"
description = "Model Context Protocol server that lets any AI client drive an open Ketchup window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = { version = "0.3.4", features = ["std"] }
ketchup-program = { path = "../ketchup-program" }
ketchup-rejection = { path = "../ketchup-rejection" }
ketchup-user-files = { path = "../ketchup-user-files" }
serde_json = "1.0"
sha2 = "0.10.9"
unicode-normalization = "0.1.24"

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
