[package]
name = "ketchup-mcp"
description = "Model Context Protocol server that lets any AI client drive an open Ketchup window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
getrandom = { version = "0.3.4", features = ["std"] }
ketchup-program = { path = "../ketchup-program" }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
