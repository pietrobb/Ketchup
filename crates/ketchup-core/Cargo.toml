[package]
name = "ketchup-core"
description = "Canonical core contracts for Ketchup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
private-oauth = []
# Test doubles for exact evaluation results; see `src/testing.rs`.
testing = []

[dependencies]
ed25519-dalek = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.23.0"

[build-dependencies]
syn = { version = "2", features = ["full"] }
serde_json = "1.0"

[dev-dependencies]
ketchup-core = { path = ".", features = ["testing"] }
ketchup-exact = { path = "../ketchup-exact" }
resvg = { version = "0.48.1", default-features = false, features = ["system-fonts", "text"] }

[lints]
workspace = true
