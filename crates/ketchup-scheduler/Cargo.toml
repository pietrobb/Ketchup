[package]
name = "ketchup-scheduler"
description = "Revision-safe evaluation scheduling and exact-worker isolation for Ketchup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
private-oauth = ["ketchup-core/private-oauth"]

[dependencies]
ketchup-core = { path = "../ketchup-core" }
ketchup-exact = { path = "../ketchup-exact" }
ketchup-interaction = { path = "../ketchup-interaction" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23.0"
wasmi = "1.1.0"
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "job-object"] }

[dev-dependencies]
ketchup-core = { path = "../ketchup-core", features = ["testing"] }
ed25519-dalek = "2.2.0"

[lints]
workspace = true
