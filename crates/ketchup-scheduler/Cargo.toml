[package]
name = "ketchup-scheduler"
description = "Revision-safe evaluation scheduling and exact-worker isolation for Ketchup"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
ketchup-analysis = { path = "../ketchup-analysis" }
ketchup-assistant = { path = "../ketchup-assistant" }
ketchup-dwg = { path = "../ketchup-dwg" }
ciborium = "0.2"
ketchup-model = { path = "../ketchup-model" }
ketchup-exact = { path = "../ketchup-exact" }
ketchup-geometry = { path = "../ketchup-geometry" }
ketchup-interaction = { path = "../ketchup-interaction" }
ketchup-program = { path = "../ketchup-program" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23.0"
wasmi = "1.1.0"
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "creation-flags", "job-object", "kill-on-drop", "process-group"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
ketchup-test-env = { path = "../ketchup-test-env" }
ketchup-dwg = { path = "../ketchup-dwg", features = ["testing"] }
ed25519-dalek = "2.2.0"
ketchup-model = { path = "../ketchup-model", features = ["testing"] }
ketchup-manufacturing = { path = "../ketchup-manufacturing" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
