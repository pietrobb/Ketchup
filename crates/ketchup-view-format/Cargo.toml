[package]
name = "ketchup-view-format"
description = "Offline Kečup Viewer package schema and bounded reader"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ketchup-rejection = { path = "../ketchup-rejection" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[dev-dependencies]
ketchup-manufacturing = { path = "../ketchup-manufacturing" }
ketchup-model = { path = "../ketchup-model", features = ["testing"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
