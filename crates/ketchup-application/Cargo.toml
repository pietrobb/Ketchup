[package]
name = "ketchup-application"
description = "GUI-independent canonical CAD application sessions for Ketchup"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
ketchup-assistant = { path = "../ketchup-assistant" }
ketchup-core = { path = "../ketchup-core" }
ketchup-interaction = { path = "../ketchup-interaction" }
ketchup-program = { path = "../ketchup-program" }
ketchup-scheduler = { path = "../ketchup-scheduler", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23.0"

[lints]
workspace = true

[dev-dependencies]
ketchup-core = { path = "../ketchup-core", features = ["testing"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
