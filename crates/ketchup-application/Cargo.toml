[package]
name = "ketchup-application"
description = "GUI-independent canonical CAD application sessions for Ketchup"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
ketchup-analysis = { path = "../ketchup-analysis" }
ketchup-assistant = { path = "../ketchup-assistant" }
ketchup-model = { path = "../ketchup-model" }
ketchup-geometry = { path = "../ketchup-geometry" }
ketchup-interaction = { path = "../ketchup-interaction" }
ketchup-pdm = { path = "../ketchup-pdm" }
ketchup-program = { path = "../ketchup-program" }
ketchup-rejection = { path = "../ketchup-rejection" }
ketchup-scheduler = { path = "../ketchup-scheduler", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23.0"

[lints]
workspace = true

[dev-dependencies]
ketchup-manufacturing = { path = "../ketchup-manufacturing" }
ketchup-model = { path = "../ketchup-model", features = ["testing"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
