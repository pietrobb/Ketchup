[package]
name = "ketchup-interaction"
description = "Exact spatial queries and canonical preview interactions for Ketchup"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ketchup-model = { path = "../ketchup-model" }
