[package]
name = "ketchup-exact"
description = "Exception-safe exact geometry facade for Ketchup"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cxx = "=1.0.198"
ketchup-tolerance = { path = "../ketchup-tolerance" }
ketchup-geometry = { path = "../ketchup-geometry" }

[build-dependencies]
cxx-build = "=1.0.198"

[lints.clippy]
all = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"

[[test]]
name = "integration"
path = "tests/integration.rs"
