[package]
name = "ketchup-app"
description = "Narrow localization-ready wgpu desktop shell for Ketchup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["private-oauth"]
private-oauth = ["ketchup-core/private-oauth", "ketchup-scheduler/private-oauth"]
named-product-fixtures = [
    "ketchup-core/named-product-fixtures",
    "ketchup-scheduler/named-product-fixtures",
]

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
ketchup-core = { path = "../ketchup-core" }
ketchup-application = { path = "../ketchup-application" }
ketchup-interaction = { path = "../ketchup-interaction" }
ketchup-scheduler = { path = "../ketchup-scheduler" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.3.4"
raw-window-handle = "0.6.2"
rfd = "0.15.4"
tempfile = "3.23.0"
wgpu = { version = "25.0.2", default-features = false, features = ["dx12"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
egui_kittest = "0.32.0"
pollster = "0.4.0"

[lints.rust]
# Denied rather than forbidden: `dialogs::DialogParentWindow` needs one audited
# `unsafe` block to borrow the raw main-window handle for modal native dialogs.
unsafe_code = "deny"

[lints.clippy]
all = "deny"
