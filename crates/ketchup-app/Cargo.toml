[package]
name = "ketchup-app"
description = "Narrow localization-ready wgpu desktop shell for Ketchup"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["private-oauth"]
private-oauth = ["ketchup-assistant/private-oauth", "ketchup-scheduler/private-oauth"]
manual-alpha = ["private-oauth"]
# Hooks only tests may use; the app's own tests enable it through the dev-dependency below.
testing = []

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
getrandom = "0.3.4"
ketchup-analysis = { path = "../ketchup-analysis" }
ketchup-application = { path = "../ketchup-application" }
ketchup-assistant = { path = "../ketchup-assistant" }
ketchup-model = { path = "../ketchup-model" }
ketchup-geometry = { path = "../ketchup-geometry" }
ketchup-interaction = { path = "../ketchup-interaction" }
ketchup-manufacturing = { path = "../ketchup-manufacturing" }
ketchup-pdm = { path = "../ketchup-pdm" }
ketchup-program = { path = "../ketchup-program" }
ketchup-rejection = { path = "../ketchup-rejection" }
ketchup-scheduler = { path = "../ketchup-scheduler" }
raw-window-handle = "0.6.2"
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23.0"
wgpu = { version = "25.0.2", default-features = false, features = ["dx12"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
ketchup-app = { path = ".", features = ["testing"] }
ketchup-model = { path = "../ketchup-model", features = ["testing"] }
egui_kittest = { version = "0.32.0", features = ["wgpu"] }
pollster = "0.4.0"

[lints.rust]
# Denied rather than forbidden: `dialogs::DialogParentWindow` needs one audited
# `unsafe` block to borrow the raw main-window handle for modal native dialogs.
unsafe_code = "deny"

[lints.clippy]
all = "deny"

[[test]]
name = "integration"
path = "tests/integration.rs"
