[package]
name = "ketchup-app"
description = "Narrow localization-ready wgpu desktop shell for Ketchup"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Hooks only tests may use; the app's own tests enable it through the dev-dependency below.
testing = []

[dependencies]
# The outlines of egui's own font, drawn as underlay text lines (already in the tree via epaint).
ab_glyph = "0.2.32"
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
getrandom = "0.3.4"
ketchup-analysis = { path = "../ketchup-analysis" }
ketchup-application = { path = "../ketchup-application" }
ketchup-assistant = { path = "../ketchup-assistant" }
ketchup-dwg = { path = "../ketchup-dwg" }
ketchup-model = { path = "../ketchup-model" }
ketchup-geometry = { path = "../ketchup-geometry" }
ketchup-interaction = { path = "../ketchup-interaction" }
ketchup-manufacturing = { path = "../ketchup-manufacturing" }
ketchup-mcp = { path = "../ketchup-mcp" }
ketchup-pdm = { path = "../ketchup-pdm" }
ketchup-program = { path = "../ketchup-program" }
ketchup-rejection = { path = "../ketchup-rejection" }
ketchup-scheduler = { path = "../ketchup-scheduler" }
raw-window-handle = "0.6.2"
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sys-locale = "0.3"
tempfile = "3.23.0"
wgpu = { version = "25.0.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }
wgpu = { version = "25.0.2", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
ketchup-macos-open = { path = "../ketchup-macos-open" }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSLocale", "NSString"] }
wgpu = { version = "25.0.2", default-features = false, features = ["metal"] }
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
ketchup-view-format = { path = "../ketchup-view-format" }
ketchup-viewer = { path = "../ketchup-viewer" }
ketchup-test-env = { path = "../ketchup-test-env" }
ketchup-dwg = { path = "../ketchup-dwg", features = ["testing"] }
ketchup-test-gpu = { path = "../ketchup-test-gpu" }
ketchup-app = { path = ".", features = ["testing"] }
ketchup-model = { path = "../ketchup-model", features = ["testing"] }
egui_kittest = { version = "0.32.0", features = ["wgpu"] }
pollster = "0.4.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

[lints.rust]
# Denied rather than forbidden: `dialogs::DialogParentWindow` needs one audited
# `unsafe` block to borrow the raw main-window handle for modal native dialogs.
unsafe_code = "deny"

[lints.clippy]
all = "deny"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "underlay_dxf_write_memory"
path = "tests/underlay_dxf_write_memory.rs"
