[package]
name = "ketchup-program"
description = "Rule programs (Starlark) that generate, validate and list Ketchup parts"
version.workspace = true
edition.workspace = true
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ketchup-assistant = { path = "../ketchup-assistant" }
anyhow = "1"
ketchup-model = { path = "../ketchup-model" }
ketchup-geometry = { path = "../ketchup-geometry" }
ketchup-tolerance = { path = "../ketchup-tolerance" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# starlark 0.14 turns on serde_json's `arbitrary_precision`, which breaks every
# tagged enum with numbers in the workspace. 0.13 does not; it needs
# allocative 0.3.4 because later releases implement it for another hashbrown.
starlark = "=0.13.0"
allocative = "=0.3.4"

[dev-dependencies]
ketchup-test-env = { path = "../ketchup-test-env" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
