[package]
name = "ketchup-viewer-web"
description = "Kečup Viewer in the browser (WebAssembly), no installation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "default_fonts"] }
js-sys = "0.3.103"
ketchup-rejection = { path = "../../crates/ketchup-rejection" }
ketchup-viewer = { path = "../../crates/ketchup-viewer" }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "BeforeUnloadEvent",
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "File",
    "FileList",
    "Headers",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Response",
    "Url",
    "Window",
] }

[lints.rust]
# wasm-bindgen exports expand to unsafe ABI shims; the crate itself has no unsafe blocks.
unsafe_code = "deny"

[lints.clippy]
all = "deny"
