[package]
name = "ketchup-viewer-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Measures a package a development install pushes as benchmark.ketchup-view
# (scripts/windows/benchmark-android-viewer.ps1); off in the Viewer customers
# install.
benchmark = []

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15"
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
jni = "0.22"
ketchup-rejection = { path = "../../crates/ketchup-rejection" }
ketchup-view-format = { path = "../../crates/ketchup-view-format" }
ketchup-viewer = { path = "../../crates/ketchup-viewer" }
log = "0.4"

[lints.rust]
# Allowed only where marked: the exported NativeActivity symbol and the JNI
# pointers android-activity hands over for calling the activity.
unsafe_code = "deny"

[lints.clippy]
all = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
