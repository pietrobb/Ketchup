[package]
name = "ketchup-viewer-macos"
description = "macOS app of the Kečup Viewer: Finder and \"Open with\" hand files over by Apple Event"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ketchup-viewer = { path = "../../crates/ketchup-viewer" }

[target.'cfg(target_os = "macos")'.dependencies]
ketchup-macos-open = { path = "../../crates/ketchup-macos-open" }

[lints.clippy]
all = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
