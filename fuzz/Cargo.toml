[package]
name = "ketchup-fuzz"
description = "cargo-fuzz targets for the readers of untrusted files: a .ketchup document, a Viewer package and its comments, the DXF, DWG, STL, GLB and SketchUp scene imports, the DXF underlay and the DXF it is written back as"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
ketchup-model = { path = "../crates/ketchup-model" }
ketchup-view-format = { path = "../crates/ketchup-view-format" }
ketchup-dwg = { path = "../crates/ketchup-dwg" }

# Not a member of the Ketchup workspace: it builds only on a nightly toolchain
# with the sanitizer flags `cargo fuzz` gives it.
[workspace]
members = ["."]

[[bin]]
name = "load"
path = "fuzz_targets/load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "view_package"
path = "fuzz_targets/view_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dxf"
path = "fuzz_targets/dxf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dxf_underlay"
path = "fuzz_targets/dxf_underlay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stl"
path = "fuzz_targets/stl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glb"
path = "fuzz_targets/glb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sketchup_scene"
path = "fuzz_targets/sketchup_scene.rs"
test = false
doc = false
bench = false

[[bin]]
name = "comments"
path = "fuzz_targets/comments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dwg"
path = "fuzz_targets/dwg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dxf_rewrite"
path = "fuzz_targets/dxf_rewrite.rs"
test = false
doc = false
bench = false
