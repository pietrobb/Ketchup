[workspace]
members = ["crates/ketchup-analysis", "crates/ketchup-app", "crates/ketchup-application", "crates/ketchup-assistant", "crates/ketchup-dwg", "crates/ketchup-model", "crates/ketchup-exact", "crates/ketchup-geometry", "crates/ketchup-headless", "crates/ketchup-interaction", "crates/ketchup-macos-open", "crates/ketchup-manufacturing", "crates/ketchup-mcp", "crates/ketchup-pdm", "crates/ketchup-program", "crates/ketchup-rejection", "crates/ketchup-scheduler", "crates/ketchup-test-env", "crates/ketchup-test-gpu", "crates/ketchup-tolerance", "crates/ketchup-view-format", "crates/ketchup-viewer", "viewer/android", "viewer/macos", "viewer/web"]
resolver = "3"
exclude = ["third_party/starlark", "third_party/process-wrap"]

# starlark 0.13.0 with one change: every loop and comprehension iteration reaches the
# `before_stmt` hook, so the program execution budget bounds them (third_party/starlark/PATCH.md).
# process-wrap 10.0.0 with a std `KillOnDrop`, so a Windows job dies with its parent
# (third_party/process-wrap/PATCH.md).
[patch.crates-io]
starlark = { path = "third_party/starlark" }
process-wrap = { path = "third_party/process-wrap" }

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/pietrobb/Ketchup"
# Nothing here is released on crates.io; path dependencies need no version.
publish = false

# Debug builds keep only line tables (backtraces still show file:line); dependencies keep none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Every worker start hashes its executable; unoptimized, that takes most of a second in tests.
[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
