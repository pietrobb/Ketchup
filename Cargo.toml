[workspace]
members = ["crates/ketchup-app", "crates/ketchup-core", "crates/ketchup-exact", "crates/ketchup-interaction", "crates/ketchup-scheduler"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/pietrobb/Ketchup"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
