name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: named-product check and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No named products in core source
        run: python scripts/check_no_named_products.py
      - name: Python tests
        run: |
          python -m pip install --quiet pytest openpyxl anthropic
          python -m pytest -q tests sdk/python/tests

  rust:
    name: format, clippy and tests
    # The runner has the pinned OCCT build installed. Pull requests from forks
    # never run on it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, ketchup-occt-r0-v1]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: build exact worker
        run: cargo build --locked -p ketchup-scheduler --bin ketchup-exact-worker
      - name: tests
        run: cargo test --locked --workspace --all-targets --no-fail-fast -- --test-threads=2
