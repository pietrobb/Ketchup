name: CI governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-guards:
    name: architecture guards
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run disposable pull-request guards
        shell: powershell
        env:
          KETCHUP_CI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: .\scripts\windows\invoke-ci-governance.ps1 -ArchitectureOnly -BaseRef $env:KETCHUP_CI_BASE_REF

      - name: Verify deliberate-red PR group paths
        shell: powershell
        run: .\scripts\windows\test-pr-ci-red-paths.ps1

  pull-request-quality-build:
    name: quality and complete build
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Windows, X64, ketchup-occt-r0-v1]
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run formatting, strict Clippy, and complete build
        shell: powershell
        run: .\scripts\windows\invoke-pr-ci-group.ps1 -Group quality-build

  pull-request-foundations:
    name: foundation product tests
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Windows, X64, ketchup-occt-r0-v1]
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run foundation tests without fail-fast
        shell: powershell
        run: .\scripts\windows\invoke-pr-ci-group.ps1 -Group foundations

  pull-request-scheduler:
    name: scheduler and exact-worker product tests
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Windows, X64, ketchup-occt-r0-v1]
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run scheduler tests without fail-fast
        shell: powershell
        run: .\scripts\windows\invoke-pr-ci-group.ps1 -Group scheduler

  pull-request-app:
    name: app and headless product tests
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Windows, X64, ketchup-occt-r0-v1]
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run app tests without fail-fast
        shell: powershell
        run: .\scripts\windows\invoke-pr-ci-group.ps1 -Group app

  governance:
    name: governed Windows build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, ketchup-occt-r0-v1]
    timeout-minutes: 90
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run coherent governance block
        shell: powershell
        env:
          KETCHUP_CI_BASE_REF: ${{ github.event.before }}
        run: .\scripts\windows\invoke-ci-governance.ps1 -BaseRef $env:KETCHUP_CI_BASE_REF
