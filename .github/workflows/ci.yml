name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly and by hand, the OCCT job also runs the large-house and the
  # release-only whole-house tests.
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its older run; every commit on main
# keeps its whole run (CI-61): its own group, so a later push neither cancels
# it nor replaces it while it waits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: named-product check and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: No named products in core source
        if: ${{ !cancelled() }}
        run: python scripts/check_no_named_products.py
      - name: No new tolerance literals outside tolerance.rs
        if: ${{ !cancelled() }}
        run: python scripts/check_tolerance_literals.py
      - name: Crate dependencies point to lower layers
        if: ${{ !cancelled() }}
        run: python scripts/check_crate_layers.py
      - name: Every workspace crate is checked by a CI job
        if: ${{ !cancelled() }}
        run: python scripts/check_ci_crates.py
      - name: No new errors that drop their cause
        if: ${{ !cancelled() }}
        run: python scripts/check_error_hygiene.py
      - name: The documented tool rail matches the window
        if: ${{ !cancelled() }}
        run: python scripts/check_tool_rail_docs.py
      - name: Tests gain no sleep calls
        if: ${{ !cancelled() }}
        run: python scripts/check_test_sleeps.py
      - name: Time budgets only in perf tests
        if: ${{ !cancelled() }}
        run: python scripts/check_test_timing.py
      - name: GPU tests share one wgpu instance
        if: ${{ !cancelled() }}
        run: python scripts/check_gpu_test_instances.py
      - name: Test hooks stay out of production code
        if: ${{ !cancelled() }}
        run: python scripts/check_test_hooks.py
      - name: Tests read their settings from ketchup-test-env
        if: ${{ !cancelled() }}
        run: python scripts/check_test_env.py
      - name: Every ignored test runs in some CI step
        if: ${{ !cancelled() }}
        run: python scripts/check_ignored_tests.py
      - name: Tests of the large house are ignored in every step
        if: ${{ !cancelled() }}
        run: python scripts/check_large_house_tests.py
      - name: BTLx schemas from the cache
        if: ${{ !cancelled() }}
        id: btlx
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/btlx-schema
          key: btlx-schema-${{ hashFiles('tests/test_btlx_schema.py', 'crates/ketchup-manufacturing/src/fabrication.rs') }}
          restore-keys: btlx-schema-
      - name: Python tests
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --quiet --require-hashes -r tests/requirements-ci.txt
          python -m pytest -q tests sdk/python/tests
      - name: BTLx schemas into the cache
        if: always() && steps.btlx.outputs.cache-hit != 'true' && hashFiles('target/btlx-schema/BTLx_2_3_1.xsd') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/btlx-schema
          key: btlx-schema-${{ hashFiles('tests/test_btlx_schema.py', 'crates/ketchup-manufacturing/src/fabrication.rs') }}

  dependencies:
    name: dependency advisories, licenses and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: cargo-deny
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/deny.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: check
        run: cargo deny --locked check

  rust-without-occt:
    name: format, clippy and tests of the crates without OCCT on ${{ matrix.os }}
    # Runs for every pull request, forks included, on GitHub-hosted Linux and
    # macOS. The windowed crates need a platform winit.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 45 }}
    env:
      CRATES: >-
        -p ketchup-analysis -p ketchup-assistant -p ketchup-dwg -p ketchup-geometry
        -p ketchup-interaction -p ketchup-manufacturing -p ketchup-mcp -p ketchup-model -p ketchup-pdm
        -p ketchup-program -p ketchup-rejection -p ketchup-test-env -p ketchup-tolerance
        -p ketchup-view-format -p ketchup-viewer-android
      # The MCP discovery directory lives in the per-user runtime directory.
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The parent tells which files the change touches.
          fetch-depth: 2
      - name: runtime directory
        run: mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked $CRATES --all-targets -- -D warnings
      # Every file the tests save also goes to KETCHUP_SAVED_FILES_DIR for the next step.
      - name: tests
        if: ${{ !cancelled() }}
        env:
          KETCHUP_SAVED_FILES_DIR: ${{ runner.temp }}/saved-files
        run: |
          mkdir -p "$KETCHUP_SAVED_FILES_DIR"
          cargo test --locked $CRATES --features ketchup-model/saved-files --no-fail-fast
      # Every released Kečup opens each file the tests saved in a format it reads and
      # refuses the others without opening their .recovery; the serde enums it knows
      # gain only reviewed variants (review 2026-10-29 proposal 5.4, MD-60; 2026-10-31 CI-80).
      - name: released versions read the files written for them
        if: ${{ !cancelled() && (runner.os == 'Linux') }}
        run: |
          git fetch --no-tags --depth=1 origin tag v0.2.0 tag v0.3.0
          python3 scripts/release_reads.py --files "$RUNNER_TEMP/saved-files"
      # Time budgets live only in ignored perf_* tests, checked in release
      # (review 2026-10-17 TST-3).
      - name: release timing budgets
        if: ${{ !cancelled() && (runner.os == 'Linux' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}
        timeout-minutes: 90
        env:
          RUST_TEST_THREADS: 1
        run: cargo test --locked --release $CRATES --no-fail-fast -- --ignored perf_
      # The tests of the 750-part house are ignored in every step (AGENTS.md
      # section 6, scripts/check_large_house_tests.py) and run nightly here,
      # on every push to main, and in a pull request that changes what they
      # evaluate (review 2026-10-24 CI-23, review 2026-10-26 CI-43).
      - name: whether the change reaches the house
        if: ${{ !cancelled() }}
        id: house
        run: python3 scripts/changes_reach_the_house.py
      - name: large-house tests
        if: ${{ !cancelled() && (runner.os == 'Linux' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.house.outputs.run == 'true')) }}
        run: cargo test --locked $CRATES --no-fail-fast -- --ignored large_house
      # The plugin host's Unix process group lives in the vendored process-wrap
      # (PATCH.md); ketchup-scheduler, which uses it, needs OCCT and is tested
      # on Windows only, so the group's own unit tests run here (review
      # 2026-10-17 EX-3).
      - name: unit tests of the vendored process-wrap
        if: ${{ !cancelled() }}
        run: >-
          cargo test --locked --manifest-path third_party/process-wrap/Cargo.toml
          --target-dir target/process-wrap --lib --no-default-features
          --features std,process-group,kill-on-drop
      # The desktop Viewer renders its own pixels in tests; on Linux the
      # Vulkan software rasterizer (lavapipe) is the adapter.
      - name: lavapipe
        if: ${{ !cancelled() && (runner.os == 'Linux') }}
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      - name: clippy and tests of the desktop Viewer on lavapipe
        if: ${{ !cancelled() && (runner.os == 'Linux') }}
        run: |
          cargo clippy --locked -p ketchup-viewer --all-targets -- -D warnings
          cargo test --locked -p ketchup-viewer --no-fail-fast

  rust-with-occt:
    name: clippy and tests of the crates with OCCT on Windows
    # A GitHub-hosted runner builds the pinned OCCT 8.0.1 once with its own
    # Visual Studio and keeps the install in the Actions cache; the window,
    # the application, the headless session, the exact kernel and the workers,
    # Windows-only code (job objects, the live bridge) included, are checked on
    # every run. scripts/check_ci_crates.py fails on a crate no job names and
    # on a crate with tests no job tests.
    runs-on: windows-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 330 || 180 }}
    env:
      CRATES: >-
        -p ketchup-app -p ketchup-application -p ketchup-exact -p ketchup-headless
        -p ketchup-scheduler -p ketchup-test-gpu
      NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The parent tells which files the change touches.
          fetch-depth: 2
      # OCCT built by one Visual Studio may not link with another's, so a
      # runner image with a newer one builds it again.
      - name: Visual Studio version
        id: vs
        shell: pwsh
        run: |
          $version = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion
          if (-not $version) { throw "vswhere found no Visual Studio" }
          "version=$(($version -split '\.')[0..1] -join '.')" >> $env:GITHUB_OUTPUT
      - name: OCCT from the cache
        id: occt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/occt-install-r0-v1
          key: occt-8.0.1-b8f597c6-windows-vs${{ steps.vs.outputs.version }}-${{ hashFiles('scripts/windows/build-occt.ps1', 'scripts/windows/check-occt-math.ps1', 'third_party/crmath/**') }}
      - name: OCCT build
        if: steps.occt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch V8_0_1 https://github.com/Open-Cascade-SAS/OCCT.git third_party/occt-src
          ./scripts/windows/build-occt.ps1 -RunnerToolchain -ParallelJobs 4
      # Saved right after the build, so an hour of OCCT is kept even when a
      # later step fails (the cache action alone saves only after success).
      - name: OCCT into the cache
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/occt-install-r0-v1
          key: ${{ steps.occt.outputs.cache-primary-key }}
      - name: clippy
        run: cargo clippy --locked $env:CRATES.Split(' ') --all-targets -- -D warnings
      # The live MCP tests launch the debug application beside its worker.
      - name: workers, the headless CLI and the application for the tests
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked -p ketchup-scheduler -p ketchup-headless --bins
          cargo build --locked -p ketchup-app --bin ketchup-app
      # The files the application, headless and scheduler tests save go to
      # KETCHUP_SAVED_FILES_DIR too, so every released Kečup opens them in the next step.
      - name: tests
        if: ${{ !cancelled() }}
        env:
          # Two OCCT test threads fit the runner's memory.
          RUST_TEST_THREADS: 2
          KETCHUP_SAVED_FILES_DIR: ${{ runner.temp }}\saved-files
        # The runner has no GPU, only the WARP software adapter; the two
        # proofs on a hardware DX12 adapter run on a developer machine.
        run: |
          New-Item -ItemType Directory -Force $env:KETCHUP_SAVED_FILES_DIR | Out-Null
          cargo test --locked $env:CRATES.Split(' ') --features ketchup-model/saved-files --no-fail-fast -- `
            --skip instanced_rendering::real_ten_thousand_occurrence_product_uses_one_scheduled_mesh_one_bvh_and_one_wgpu_draw `
            --skip instanced_rendering::garden_studio_hardware_gpu_camera_frames
      - name: released versions read the files the application tests wrote
        if: ${{ !cancelled() }}
        run: |
          git fetch --no-tags --depth=1 origin tag v0.2.0 tag v0.3.0
          python scripts/release_reads.py --files "$env:RUNNER_TEMP\saved-files"
      # The Viewer's comment save has its own Windows code, which the Linux
      # Viewer job never compiles (review 2026-10-19).
      - name: atomic comment save on Windows
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test --locked -p ketchup-viewer --lib -- --exact \
            app::tests::atomic_save::interrupted_save_keeps_the_earlier_file_and_leaves_no_partial_one \
            | tee "$RUNNER_TEMP/atomic-save.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/atomic-save.log"
      # The cutting plan, quote, CNC drawings and BTLx files must be the same
      # bytes as on Linux and macOS, where the job without OCCT checks the same
      # golden files (review 2026-10-29 proposal 5.1, ADR 0009).
      - name: golden shop files on Windows
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test --locked -p ketchup-program --test integration -- shop_golden:: \
            | tee "$RUNNER_TEMP/shop-golden.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/shop-golden.log"
          cargo test --locked -p ketchup-manufacturing --test integration -- fabrication_validation:: \
            | tee "$RUNNER_TEMP/btlx-golden.log"
          grep -Eq "test result: ok. [1-9][0-9]* passed" "$RUNNER_TEMP/btlx-golden.log"
      # The Python tests that drive the real CLI skip without it in the
      # checks job; here every such file runs and a skip fails (review
      # 2026-10-17 TST-2).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: ${{ !cancelled() }}
        with:
          python-version: "3.11"
      - name: native Python tests against the built CLI
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --quiet --require-hashes -r tests/requirements-ci.txt
          python scripts/run_production_tests.py --prebuilt
      - name: whether the change reaches the house
        if: ${{ !cancelled() }}
        id: house
        run: python scripts/changes_reach_the_house.py
      - name: large-house tests
        if: ${{ !cancelled() && (env.NIGHTLY == 'true' || steps.house.outputs.run == 'true') }}
        env:
          RUST_TEST_THREADS: 2
        run: cargo test --locked $env:CRATES.Split(' ') --no-fail-fast -- --ignored large_house
      # The tests find the worker beside them, so it is built in release too.
      - name: release workers
        if: ${{ !cancelled() && (env.NIGHTLY == 'true') }}
        run: cargo build --locked --release -p ketchup-scheduler --bins
      # Their geometry checks finish within the window's limits only in the
      # optimized build (RELEASE_APP_TESTS in scripts/run_production_tests.py).
      - name: live MCP tests against the release application
        if: ${{ !cancelled() && (env.NIGHTLY == 'true') }}
        run: |
          cargo build --locked --release -p ketchup-app --bin ketchup-app
          python scripts/run_production_tests.py --release-app
      - name: release-only whole-house tests
        if: ${{ !cancelled() && (env.NIGHTLY == 'true') }}
        env:
          RUST_TEST_THREADS: 2
        run: >-
          cargo test --locked --release -p ketchup-application --no-fail-fast --
          --ignored house_panel_validation:: house_project_collision::
      # One at a time, so no test times the others. The two skipped need a
      # hardware GPU and run on a developer machine; every other ignored test
      # runs in some step (scripts/check_ignored_tests.py).
      - name: release timing budgets
        if: ${{ !cancelled() && (env.NIGHTLY == 'true') }}
        timeout-minutes: 90
        env:
          RUST_TEST_THREADS: 1
        run: >-
          cargo test --locked --release $env:CRATES.Split(' ') --no-fail-fast --
          --ignored perf_
          --skip perf_ten_thousand_occurrence_cached_orbit_checks_within_budget
          --skip perf_garden_studio_hardware_gpu_camera_frames_within_budget
      # The Blender reference is a release asset, kept out of the repository.
      - name: garden studio against its Blender source
        if: ${{ !cancelled() && (env.NIGHTLY == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download sample-files --pattern garden-studio-exact.blender-reference.json --dir examples
          cargo test --locked --release -p ketchup-app --no-fail-fast -- --ignored garden_studio_source_parity
      # The packages docs/viewer/performance.md measures stay exportable.
      - name: Viewer reference packages
        if: ${{ !cancelled() && (env.NIGHTLY == 'true') }}
        run: cargo test --locked --release -p ketchup-app --no-fail-fast -- --ignored viewer_reference_packages

  rust-with-occt-linux:
    name: clippy and tests of the crates with OCCT on Linux
    # The crates with OCCT were compiled on Windows only, so their code for
    # the other systems broke unseen (review 2026-10-29 CI-62). The pinned
    # OCCT 8.0.1 with CORE-MATH is built by scripts/linux/build-occt.sh and
    # kept in the Actions cache; the binaries find it through their rpath, as
    # the README describes for a Linux build.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CRATES: >-
        -p ketchup-app -p ketchup-application -p ketchup-exact -p ketchup-headless
        -p ketchup-scheduler -p ketchup-test-gpu
      RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ github.workspace }}/third_party/occt-install-r0-v1/lib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The MCP discovery directory and the plugin stages live in the per-user
      # runtime directory. Like /run/user/<uid> it has no shared parent: under
      # /tmp an interpreter could load a module another user put in /tmp
      # (review 2026-10-17 SEC-7), and the plugin tests refuse such a stage.
      - name: runtime directory
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      # Ninja and clang build OCCT; the file dialogs need GTK; the window's
      # tests render on the Vulkan software rasterizer (lavapipe).
      - name: system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build clang libgtk-3-dev mesa-vulkan-drivers
      - name: OCCT from the cache
        id: occt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/occt-install-r0-v1
          key: occt-8.0.1-b8f597c6-ubuntu24.04-x64-${{ hashFiles('scripts/linux/build-occt.sh', 'third_party/crmath/**') }}
      - name: OCCT build
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch V8_0_1 https://github.com/Open-Cascade-SAS/OCCT.git third_party/occt-src
          scripts/linux/build-occt.sh
      - name: OCCT into the cache
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/occt-install-r0-v1
          key: ${{ steps.occt.outputs.cache-primary-key }}
      - name: clippy
        run: cargo clippy --locked $CRATES --all-targets -- -D warnings
      # The live MCP tests launch the debug application beside its worker.
      - name: workers, the headless CLI and the application for the tests
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked -p ketchup-scheduler -p ketchup-headless --bins
          cargo build --locked -p ketchup-app --bin ketchup-app
      # The files the tests save go to KETCHUP_SAVED_FILES_DIR too, so every
      # released Kečup opens them in the next step.
      - name: tests
        if: ${{ !cancelled() }}
        env:
          # Two OCCT test threads fit the runner's memory.
          RUST_TEST_THREADS: 2
          KETCHUP_SAVED_FILES_DIR: ${{ runner.temp }}/saved-files
        # The two proofs on a hardware GPU run on a developer machine.
        run: |
          mkdir -p "$KETCHUP_SAVED_FILES_DIR"
          cargo test --locked $CRATES --features ketchup-model/saved-files --no-fail-fast -- \
            --skip instanced_rendering::real_ten_thousand_occurrence_product_uses_one_scheduled_mesh_one_bvh_and_one_wgpu_draw \
            --skip instanced_rendering::garden_studio_hardware_gpu_camera_frames
      - name: released versions read the files the tests wrote
        if: ${{ !cancelled() }}
        run: |
          git fetch --no-tags --depth=1 origin tag v0.2.0 tag v0.3.0
          python3 scripts/release_reads.py --files "$RUNNER_TEMP/saved-files"

  viewer-targets:
    name: clippy of the phone and browser Viewers
    # Their code (JNI, file descriptors, fetch) is compiled only for its own
    # target, so a host build never sees it. Checking needs no NDK.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: targets
        run: rustup target add aarch64-linux-android wasm32-unknown-unknown
      - name: clippy for Android
        run: cargo clippy --locked -p ketchup-viewer-android --target aarch64-linux-android --all-targets -- -D warnings
      - name: clippy for the browser
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p ketchup-viewer-web --target wasm32-unknown-unknown -- -D warnings
      - name: the browser Viewer reads the browser's languages
        if: ${{ !cancelled() }}
        # sys-locale without its js feature returns no language in a browser.
        run: cargo tree --locked -p ketchup-viewer-web --target wasm32-unknown-unknown -e normal -i js-sys | grep -q "sys-locale v"

  viewer-macos:
    name: clippy of the macOS Viewer
    # The Apple Event handler compiles only on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: clippy
        run: cargo clippy --locked -p ketchup-viewer-macos -p ketchup-macos-open -p ketchup-viewer --all-targets -- -D warnings
      # The Viewer's comment save has its own Windows and macOS code, which
      # the Linux Viewer job never compiles; a renamed test fails here
      # instead of silently matching nothing (review 2026-10-19).
      - name: atomic comment save on macOS
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test --locked -p ketchup-viewer --lib -- --exact \
            app::tests::atomic_save::interrupted_save_keeps_the_earlier_file_and_leaves_no_partial_one \
            | tee "$RUNNER_TEMP/atomic-save.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/atomic-save.log"

  macos-app:
    name: the macOS app bundle and the live tests against it
    # Only a built bundle shows a file the bundle lacks: Kečup.app left out the
    # program worker, so programs, DWG import and underlays failed on a Mac
    # while the bundle opened documents fine (review 2026-10-30). The live MCP
    # tests evaluate programs through the bundle's own workers and OCCT, with
    # the build's OCCT moved away. An Apple Silicon runner, as the bundle.
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: OCCT from the cache
        id: occt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/occt-install-r0-v1
          key: occt-8.0.1-b8f597c6-macos-arm64-${{ hashFiles('scripts/macos/build-occt.sh', 'third_party/crmath/**') }}
      - name: OCCT build
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          command -v ninja >/dev/null || brew install ninja
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch V8_0_1 https://github.com/Open-Cascade-SAS/OCCT.git third_party/occt-src
          scripts/macos/build-occt.sh
      - name: OCCT into the cache
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/occt-install-r0-v1
          key: ${{ steps.occt.outputs.cache-primary-key }}
      - name: app bundle
        run: scripts/macos/build-app.sh --output "$RUNNER_TEMP/macos-app"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: live MCP tests against the bundle
        run: |
          python -m pip install --quiet --require-hashes -r tests/requirements-ci.txt
          mv third_party/occt-install-r0-v1 "$RUNNER_TEMP/occt-out-of-reach"
          python scripts/run_production_tests.py --packaged-app "$RUNNER_TEMP/macos-app/Kečup.app/Contents/MacOS/ketchup-app"

  fuzz:
    name: fuzzing of the document, Viewer package and import readers
    # libFuzzer with AddressSanitizer runs every target in fuzz/Cargo.toml
    # (load(), Package::read_with_comments, Comments::read_unbound, the DWG
    # reader and the DXF, STL, GLB and SketchUp scene imports and the DXF
    # underlay); one input may take 10 s and the process 2 GiB. Each run starts
    # from the seeds in fuzz/seeds and the corpus earlier runs kept in the
    # Actions cache (tests/test_fuzz_job.py). Only the nightly and manual runs
    # look for new inputs, two minutes a target, and keep the corpus they grow;
    # a push or pull request replays the seeds and the kept corpus once, so an
    # input that crashes code a pull request did not touch fails the nightly
    # run, not that pull request. A crash's input is uploaded as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NIGHTLY: nightly-2026-10-01
      FUZZ_VERSION: 0.13.2
      LIMITS: -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=2048
      EXPLORE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo install cargo-fuzz --version "$FUZZ_VERSION" --locked
      # cargo fuzz has no --locked; a stale fuzz/Cargo.lock fails here instead
      # of being rewritten by the build.
      - name: dependencies from the committed lock file
        run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: build
        run: cargo "+$NIGHTLY" fuzz build --fuzz-dir fuzz -O
      - name: corpus of earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: seeds kept elsewhere in the repository
        run: |
          mkdir -p fuzz/seeds/load fuzz/seeds/view_package fuzz/seeds/glb fuzz/seeds/dxf_underlay/
          cp fuzz/seeds/dxf/* fuzz/seeds/dxf_underlay/
          cp fuzz/seeds/dxf/* fuzz/seeds/dxf_rewrite/
          cp crates/ketchup-assistant/tests/fixtures/intent_entities.ketchup examples/programs/table.ketchup fuzz/seeds/load/
          cp viewer/samples/kitchen.ketchup-view fuzz/seeds/view_package/
          cp artifacts/blender/garden-studio-colored.glb fuzz/seeds/glb/
      # A crashing target is recorded and the loop goes on, so one open crash
      # does not leave every later target unfuzzed; the step fails at the end
      # and names every target that crashed (capability review 2026-10-23).
      - name: every target
        run: |
          if [ "$EXPLORE" = true ]; then LENGTH=-max_total_time=120; else LENGTH=-runs=0; fi
          targets=$(cargo "+$NIGHTLY" fuzz list --fuzz-dir fuzz)
          failed=()
          for target in $targets; do
            echo "::group::$target"
            mkdir -p "fuzz/corpus/$target"
            cargo "+$NIGHTLY" fuzz run --fuzz-dir fuzz -O "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- $LENGTH $LIMITS || failed+=("$target")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::fuzz targets that crashed: ${failed[*]}"
            exit 1
          fi
      - name: input of a found crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts
          if-no-files-found: ignore
      # Saved after a found crash too, so the next run starts from the same corpus.
      - name: corpus for later runs
        if: always() && env.EXPLORE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

  rust-required:
    name: CI passed
    # A skipped job counts as passed for a required check; this job fails
    # unless every job it needs ran and passed.
    needs: [checks, dependencies, rust-without-occt, rust-with-occt, rust-with-occt-linux, viewer-targets, viewer-macos, macos-app, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job did not pass ($RESULTS)."
              exit 1
            fi
          done
