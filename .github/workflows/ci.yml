name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: named-product check and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: No named products in core source
        run: python scripts/check_no_named_products.py
      - name: No new tolerance literals outside tolerance.rs
        run: python scripts/check_tolerance_literals.py
      - name: Crate dependencies point to lower layers
        run: python scripts/check_crate_layers.py
      - name: No new errors that drop their cause
        run: python scripts/check_error_hygiene.py
      - name: The documented tool rail matches the window
        run: python scripts/check_tool_rail_docs.py
      - name: Tests gain no sleep calls
        run: python scripts/check_test_sleeps.py
      - name: GPU tests share one wgpu instance
        run: python scripts/check_gpu_test_instances.py
      - name: Test hooks stay out of production code
        run: python scripts/check_test_hooks.py
      - name: Tests read their settings from ketchup-test-env
        run: python scripts/check_test_env.py
      - name: Python tests
        run: |
          python -m pip install --quiet --require-hashes -r tests/requirements-ci.txt
          python -m pytest -q tests sdk/python/tests

  dependencies:
    name: dependency advisories, licenses and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: cargo-deny
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/deny.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: check
        run: cargo deny --locked check

  rust-without-occt:
    name: format, clippy and tests of the crates without OCCT
    # Runs for every pull request, forks included. The windowed crates need a
    # platform winit.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRATES: >-
        -p ketchup-analysis -p ketchup-assistant -p ketchup-dwg -p ketchup-geometry
        -p ketchup-interaction -p ketchup-manufacturing -p ketchup-mcp -p ketchup-model -p ketchup-pdm
        -p ketchup-program -p ketchup-rejection -p ketchup-test-env -p ketchup-tolerance
        -p ketchup-view-format -p ketchup-viewer-android
      # The MCP discovery directory lives in the per-user runtime directory.
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: runtime directory
        run: mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked $CRATES --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked $CRATES --no-fail-fast

  rust-with-occt:
    name: clippy and tests of the crates with OCCT on Windows
    # A GitHub-hosted runner builds the pinned OCCT 8.0.1 once with its own
    # Visual Studio and keeps the install in the Actions cache; the window,
    # the application, the exact kernel and the workers, Windows-only code
    # (job objects, the live bridge) included, are checked on every run.
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CRATES: -p ketchup-app -p ketchup-application -p ketchup-exact -p ketchup-scheduler
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: OCCT from the cache
        id: occt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/occt-install-r0-v1
          key: occt-8.0.1-b8f597c6-windows-${{ hashFiles('scripts/windows/build-occt.ps1') }}
      - name: OCCT build
        if: steps.occt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch V8_0_1 https://github.com/Open-Cascade-SAS/OCCT.git third_party/occt-src
          ./scripts/windows/build-occt.ps1 -RunnerToolchain -ParallelJobs 4
      # Saved right after the build, so an hour of OCCT is kept even when a
      # later step fails (the cache action alone saves only after success).
      - name: OCCT into the cache
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/occt-install-r0-v1
          key: ${{ steps.occt.outputs.cache-primary-key }}
      - name: clippy
        run: cargo clippy --locked $env:CRATES.Split(' ') --all-targets -- -D warnings
      - name: workers for the tests
        run: cargo build --locked -p ketchup-scheduler --bins
      - name: tests
        env:
          # Two OCCT test threads fit the runner's memory.
          RUST_TEST_THREADS: 2
        # The runner has no GPU, only the WARP software adapter; the two
        # proofs on a hardware DX12 adapter run on a developer machine.
        run: >-
          cargo test --locked $env:CRATES.Split(' ') --no-fail-fast --
          --skip instanced_rendering::real_ten_thousand_occurrence_product_uses_one_scheduled_mesh_one_bvh_and_one_wgpu_draw
          --skip instanced_rendering::garden_studio_hardware_gpu_camera_frames

  viewer-targets:
    name: clippy of the phone and browser Viewers
    # Their code (JNI, file descriptors, fetch) is compiled only for its own
    # target, so a host build never sees it. Checking needs no NDK.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: targets
        run: rustup target add aarch64-linux-android wasm32-unknown-unknown
      - name: clippy for Android
        run: cargo clippy --locked -p ketchup-viewer-android --target aarch64-linux-android --all-targets -- -D warnings
      - name: clippy for the browser
        run: cargo clippy --locked -p ketchup-viewer-web --target wasm32-unknown-unknown -- -D warnings

  viewer-macos:
    name: clippy of the macOS Viewer
    # The Apple Event handler compiles only on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: clippy
        run: cargo clippy --locked -p ketchup-viewer-macos -p ketchup-viewer --all-targets -- -D warnings

  rust-required:
    name: CI passed
    # A skipped job counts as passed for a required check; this job fails
    # unless every job it needs ran and passed.
    needs: [checks, dependencies, rust-without-occt, rust-with-occt, viewer-targets, viewer-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job did not pass ($RESULTS)."
              exit 1
            fi
          done
